<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simülasyon Feed</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="feed">
  <main class="app">
    <header class="page-header">
      <h1>Simülasyon Feed</h1>
      <nav class="top-nav">
        <a href="admin.html">Admin</a>
        <a class="active" href="feed.html">Feed</a>
        <a href="stats.html">Stats</a>
      </nav>
    </header>

    <section id="feedButtonsView" class="card">
      <h2>Oynatılabilir Simülasyonlar</h2>
      <div id="feedButtonList" class="button-grid"></div>
    </section>

    <section id="simulationView" class="card hidden">
      <div class="sim-head">
        <h2 id="activeSimName">-</h2>
        <div id="timerDisplay" class="timer">0.0s</div>
      </div>
      <div class="canvas-wrap">
        <canvas id="simulationCanvas" width="1000" height="620"></canvas>
        <div id="countdownOverlay" class="countdown hidden">3</div>
      </div>
      <div class="sim-controls">
        <button id="playButton" class="btn primary">▶ Play</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
