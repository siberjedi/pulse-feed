<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Feed • Mobile Lyric Video</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="mobile" class="mobile-page">
  <div class="mobile-shell">
    <main class="feed-stage mobile-stage" id="feedStage">
      <div id="backgroundLayer" class="background-layer"></div>
      <div class="overlay-shade"></div>

      <section class="visualizer-zone top-zone"><canvas id="visualizerTop"></canvas></section>
      <section class="lyrics-zone" id="lyricsZone"><div id="lyricLine" class="lyric-line"></div></section>
      <section class="visualizer-zone bottom-zone"><canvas id="visualizerBottom"></canvas></section>

      <article id="musicPlayer" class="music-player mobile-player">
        <div class="mini-visualizer"><canvas id="playerViz"></canvas></div>
        <h3 id="playerSongName">Şarkı yüklenmedi</h3>
        <p class="artist">PulseFeed</p>
        <div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
        <input id="seekBar" type="range" min="0" max="100" value="0" />
        <div class="button-row player-buttons"><button id="playBtn" type="button">▶</button></div>
      </article>

      <div class="feed-tools mobile-tools">
        <a class="nav-btn" href="admin.html">Admin</a>
        <a class="nav-btn" href="feed.html">Desktop Feed</a>
        <button id="stagePlayBtn" type="button">▶ Müziği Başlat / Durdur</button>
        <button id="recordBtn" type="button">🎥 Fullscreen Kayda Başla</button>
        <a id="downloadRecord" class="nav-btn hidden" download="lyric-video-mobile.webm">Kaydı İndir</a>
      </div>

      <audio id="audio" crossorigin="anonymous"></audio>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
