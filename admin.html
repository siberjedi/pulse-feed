<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Feed • Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="admin">
  <div class="admin-layout">
    <header class="panel top-header">
      <div>
        <h1>Lyric Video Admin</h1>
        <p>Her bölüm bağımsız kaydolur. Sadece müzik ekleyip kaydedebilir, diğerlerini sonra doldurabilirsiniz.</p>
      </div>
      <a class="nav-btn" href="feed.html">Feed sayfasına geç</a>
    </header>

    <section class="panel">
      <h2>1) Şarkı ve Oynatıcı Ayarları</h2>
      <div class="grid two">
        <label>Şarkı dosyası (.mp3, .wav)
          <input id="songFile" type="file" accept="audio/mpeg,audio/wav,.mp3,.wav" />
        </label>
        <label>Şarkı adı
          <input id="songTitle" type="text" placeholder="Şarkı adı" />
        </label>
      </div>
      <div class="grid two">
        <label class="checkbox-line"><input id="showPlayerToggle" type="checkbox" checked /> Feed'de player görünsün</label>
        <label class="checkbox-line"><input id="visualizerWithSongToggle" type="checkbox" /> Şarkı ile visualizer kullan</label>
      </div>
      <p id="songInfo" class="hint">Henüz şarkı yüklenmedi.</p>
      <div class="section-actions"><button type="button" data-save-section="song">Şarkı ayarlarını kaydet</button></div>
    </section>

    <section class="panel">
      <h2>2) Visualizer Ayarları</h2>
      <div class="grid three">
        <label class="checkbox-line"><input id="visualizerEnabled" type="checkbox" /> Visualizer açık</label>
        <label>Tür
          <select id="visualizerType">
            <option value="bar">Bar visualizer</option>
            <option value="wave">Wave visualizer</option>
            <option value="particle">Particle / Abstract visualizer</option>
          </select>
        </label>
        <label>Renk
          <input id="visualizerColor" type="color" value="#5f87ff" />
        </label>
      </div>
      <div class="section-actions"><button type="button" data-save-section="visualizer">Visualizer ayarlarını kaydet</button></div>
    </section>

    <section class="panel">
      <h2>3) Arkaplan Video / Renk</h2>
      <div class="grid three">
        <label>Arkaplan videosu ekle (gif/mp4/mkv/webm)
          <input id="backgroundFiles" type="file" accept="video/mp4,video/webm,video/x-matroska,image/gif,.mp4,.webm,.mkv,.gif" multiple />
        </label>
        <label>Oynatma modu
          <select id="backgroundMode"><option value="loop">Loop (tek video)</option><option value="list">Liste (sıralı)</option></select>
        </label>
        <label>Video yoksa arkaplan rengi
          <input id="backgroundColor" type="color" value="#040812" />
        </label>
      </div>
      <div id="backgroundList" class="list-box"></div>
      <div class="section-actions"><button type="button" data-save-section="background">Arkaplan ayarlarını kaydet</button></div>
    </section>

    <section class="panel">
      <h2>4) Lyrics ve Timestamp</h2>
      <label>Giriş formatı: <code>start|end|lyric</code> (satır satır)
        <textarea id="lyricsInput" rows="6" placeholder="2.100|3.800|Jedi Records...\n5.009|5.900|Bu Bina Sağlam..."></textarea>
      </label>
      <div class="button-row">
        <button id="parseLyricsBtn" type="button">Lyrics Parse Et</button>
        <label>Tümüne efekt uygula <select id="applyAllEffect"></select></label>
        <label>Tümüne font uygula <select id="applyAllFont"></select></label>
        <label>Tümüne yazı rengi uygula <input id="applyAllTextColor" type="color" value="#ffffff" /></label>
        <label>Tümüne outline rengi uygula <input id="applyAllOutlineColor" type="color" value="#000000" /></label>
        <label>Tümüne outline kalınlığı uygula <input id="applyAllOutlineWidth" type="range" min="0" max="14" step="1" value="3" /></label>
      </div>
      <div class="button-row">
        <label>Desktop lyric boyut ölçeği
          <input id="desktopLyricScale" type="number" min="12" step="0.5" value="12" />
        </label>
        <label>Mobile lyric boyut ölçeği
          <input id="mobileLyricScale" type="number" min="12" step="0.5" value="12" />
        </label>
        <label class="checkbox-line"><input id="mobileFullWidthLyrics" type="checkbox" /> Mobilde lyric alanı tam genişlikte</label>
      </div>
      <div id="lyricsTable" class="lyrics-table"></div>
      <div class="section-actions"><button type="button" data-save-section="lyrics">Lyric ayarlarını kaydet</button></div>
    </section>

    <section class="panel">
      <h2>5) Font Yükleme</h2>
      <label>Font dosyaları (woff/woff2/ttf/otf), toplu yükleme destekli
        <input id="fontFiles" type="file" accept=".woff,.woff2,.ttf,.otf,font/woff,font/woff2,font/ttf,font/otf" multiple />
      </label>
      <div id="fontPreviewList" class="font-preview-list"></div>
      <div class="section-actions"><button type="button" data-save-section="fonts">Font ayarlarını kaydet</button></div>
    </section>

    <section class="panel sticky-footer">
      <button id="saveAllBtn" type="button" class="primary">Tüm ayarları kaydet</button>
      <span id="saveStatus" class="hint"></span>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
