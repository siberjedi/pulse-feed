<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Survivor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Outfit:wght@300;400;500;600;700&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: #050508;
  color: #f0e6d3;
  font-family: 'Outfit', system-ui, sans-serif;
  overflow: hidden;
  -webkit-app-region: drag; /* pencereyi sürüklenebilir yap */
}
button, input, select, textarea, label { -webkit-app-region: no-drag; }

/* ── TOP BAR ── */
#topbar {
  height: 54px;
  background: #0a0608;
  border-bottom: 1px solid #1a0a05;
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 6px;
  flex-shrink: 0;
  position: relative;
  z-index: 30;
}
.logo {
  font-family: 'Cinzel Decorative', serif;
  font-size: 13px;
  background: linear-gradient(135deg, #ff6b1a, #ffd700);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-right: 10px;
  white-space: nowrap;
}
.ai-tab {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid transparent;
  cursor: pointer;
  background: transparent;
  color: #666;
  font-size: 13px;
  font-family: inherit;
  font-weight: 500;
  transition: all .18s;
  white-space: nowrap;
}
.ai-tab:hover { background: #1a0a05; color: #aaa; }
.ai-tab.active { background: #1a0a05; border-color: var(--c); color: var(--c); }
.ai-tab .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #333;
  flex-shrink: 0;
}
.ai-tab .dot.loading { background: #f59e0b; animation: pulse 1s infinite; }
.ai-tab .dot.ready   { background: #22c55e; }
.ai-tab .dot.error   { background: #ef4444; }

.layout-btn {
  margin-left: auto;
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid #2a1a10;
  background: #0f0a08;
  color: #888;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  transition: all .18s;
  letter-spacing: .05em;
}
.layout-btn:hover { border-color: #ff6b1a55; color: #ccc; }
.layout-btn.active { border-color: #ff6b1a; color: #ff6b1a; background: #1a0800; }
#tabs {
  display: flex;
  gap: 6px;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
#tabs::-webkit-scrollbar { display: none; }

.menu-toggle {
  height: 44px;
  border-radius: 10px;
  border: 1px solid #2a1a10;
  background: #0f0a08;
  color: #e2c6aa;
  cursor: pointer;
  font-size: 12px;
  padding: 0 12px;
  white-space: nowrap;
}
.menu-toggle:hover { border-color: #ff6b1a66; color: #ffd7b0; }

#side-menu {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 88px;
  width: auto;
  max-height: min(52vh, 560px);
  overflow: auto;
  background: #0b0808;
  border: 1px solid #2a1a10;
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 18px 40px #00000099;
  opacity: 0;
  transform: translateY(-8px);
  pointer-events: none;
  transition: .18s ease;
  z-index: 1200;
}
#side-menu.open {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
#side-menu.fullscreen {
  top: 54px;
  bottom: 96px;
  max-height: none;
}
.menu-card {
  border: 1px solid #25160d;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 10px;
  background: #0f0a08;
}
.menu-title {
  color: #ffb98d;
  font-size: 12px;
  letter-spacing: .08em;
  margin-bottom: 8px;
  text-transform: uppercase;
}
.players-row, .vote-row, .score-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 6px;
}
.players-row label, .vote-label {
  font-size: 12px;
  color: #d6b89d;
}
.vote-row select, .score-row select, .score-row input {
  background: #090607;
  border: 1px solid #2a1a10;
  border-radius: 7px;
  color: #f0e6d3;
  font-size: 12px;
  padding: 5px 8px;
}
.score-row input { width: 75px; }
.output-box {
  width: 100%;
  min-height: 96px;
  background: #080506;
  border: 1px solid #2a1a10;
  border-radius: 8px;
  color: #f0e6d3;
  padding: 8px;
  font-size: 12px;
  line-height: 1.45;
  resize: vertical;
}
.copy-btn {
  margin-top: 6px;
  border: 1px solid #4a2d18;
  background: #1a0d07;
  color: #ffd7b0;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 11px;
  cursor: pointer;
}
.copy-btn:hover { border-color: #ff6b1a; }
.panel-tools {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}
.panel-tools button {
  border: 1px solid #4a2d18;
  background: #120905;
  color: #ffd7b0;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 11px;
  cursor: pointer;
}

/* ── MIDDLE (BrowserViews buraya) ── */
#viewport { flex: 1; }

/* ── BOTTOM BROADCAST BAR ── */
#broadcast {
  min-height: 90px;
  background: #080508;
  border-top: 1px solid #1a0a05;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  flex-shrink: 0;
}
.target-chips {
  display: flex;
  gap: 5px;
  align-items: center;
}
.chip {
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid #2a1a10;
  background: #0a0608;
  color: #666;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  transition: all .15s;
}
.chip.selected {
  border-color: var(--c);
  color: var(--c);
  background: #110808;
}
.chip:disabled {
  opacity: .35;
  cursor: not-allowed;
}
#msg-input {
  flex: 1;
  background: #0f0a08;
  border: 1px solid #2a1a10;
  border-radius: 10px;
  color: #f0e6d3;
  font-size: 14px;
  font-family: inherit;
  padding: 10px 16px;
  outline: none;
  transition: border-color .2s;
  resize: none;
  min-height: 72px;
  line-height: 1.5;
}
#msg-input:focus { border-color: #ff6b1a55; }
#msg-input::placeholder { color: #3a2010; }
#send-btn {
  padding: 12px 22px;
  background: linear-gradient(135deg, #ff6b1a, #cc4a00);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 13px;
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: .06em;
  text-transform: uppercase;
  white-space: nowrap;
  box-shadow: 0 0 16px #ff6b1a33;
  transition: all .2s;
}
#send-btn:hover { box-shadow: 0 0 24px #ff6b1a55; transform: translateY(-1px); }
#send-btn:active { transform: translateY(0); }
#send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: #1a0a05;
  border: 1px solid #ff6b1a44;
  border-radius: 10px;
  padding: 10px 20px;
  font-size: 13px;
  color: #f0e6d3;
  opacity: 0;
  transition: all .3s;
  pointer-events: none;
  white-space: nowrap;
  z-index: 999;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <span class="logo">🔥 AI SURVIVOR</span>
  <div id="tabs"></div>
  <button class="layout-btn active" id="btn-split" onclick="setLayout('split')">⠿ HEPSİ</button>
  <button class="layout-btn" id="btn-focus" onclick="setLayoutFocus()">⊡ ODAK</button>
</div>

<aside id="side-menu" aria-label="Oylama ve puanlama menüsü">
  <div class="panel-tools">
    <button type="button" id="panel-fullscreen-btn">⛶ Tam Ekran</button>
    <button type="button" id="panel-top-btn">⇡ AI Ayarlarına Git</button>
  </div>
  <section class="menu-card">
    <div class="menu-title">AI Admin (Aktif Et / Kapat)</div>
    <div class="players-row" id="ai-admin-row"></div>
  </section>

  <section class="menu-card">
    <div class="menu-title">Oyuncular</div>
    <div class="players-row" id="players-row"></div>
  </section>

  <section class="menu-card">
    <div class="menu-title">Eleme Oylaması</div>
    <div id="elimination-votes"></div>
    <textarea id="elimination-results" class="output-box" readonly></textarea>
    <button class="copy-btn" onclick="copyText('elimination-results')">Oylama sonuçları kopyala</button>
  </section>

  <section class="menu-card">
    <div class="menu-title">Puanlama</div>
    <div id="score-rows"></div>
    <textarea id="score-results" class="output-box" readonly></textarea>
    <button class="copy-btn" onclick="copyText('score-results')">Puanlama sonuçları kopyala</button>
  </section>
</aside>

<!-- VIEWPORT placeholder (BrowserViews buraya konumlanır) -->
<div id="viewport"></div>

<!-- BROADCAST BAR -->
<div id="broadcast">
  <button class="menu-toggle" id="menu-toggle" title="Oylama/Puanlama">⚙ ADMIN / OYLAMA</button>
  <div class="target-chips" id="chips"></div>
  <textarea id="msg-input" placeholder="Hepsine aynı anda mesaj gönder... (Enter = gönder)" onkeydown="handleKey(event)"></textarea>
  <button id="send-btn" onclick="sendBroadcast()">GÖNDER ⚡</button>
</div>

<div id="toast"></div>

<script>
let AI_SITES = []
let ALL_SITES = []
let CORE_SITE_IDS = []

const TOURNAMENT_KEY = 'aiSurvivor.tournament.v1'
let statusMap = {}       // { siteId: 'loading'|'ready' }
let selectedTargets = new Set()
let selectedPlayers = new Set()
let currentLayout = 'split'
let focusId = 'claude'
let eliminationVotes = {}   // { voterId: targetId }
let scoreVotes = {}         // { voterId: { targetId, points } }

/* ── BUILD UI ── */
function buildTabs() {
  const container = document.getElementById('tabs')
  container.innerHTML = ''
  AI_SITES.forEach(site => {
    const tab = document.createElement('button')
    tab.className = 'ai-tab' + (currentLayout === 'focus' && focusId === site.id ? ' active' : '')
    tab.style.setProperty('--c', site.color)
    tab.id = 'tab-' + site.id
    tab.innerHTML = `<span class="dot" id="dot-${site.id}"></span>${site.emoji} ${site.name}`
    tab.onclick = () => {
      if (currentLayout === 'focus') {
        focusId = site.id
        window.aiSurvivor.setLayout('focus', site.id)
        document.querySelectorAll('.ai-tab').forEach(t => t.classList.remove('active'))
        tab.classList.add('active')
      }
    }
    container.appendChild(tab)
  })
}

function buildChips() {
  const container = document.getElementById('chips')
  container.innerHTML = ''
  AI_SITES.forEach(site => {
    const chip = document.createElement('button')
    chip.className = 'chip selected'
    chip.style.setProperty('--c', site.color)
    chip.id = 'chip-' + site.id
    chip.textContent = site.emoji + ' ' + site.name
    if (!selectedPlayers.has(site.id)) chip.disabled = true
    chip.onclick = () => {
      if (!selectedPlayers.has(site.id)) return
      if (selectedTargets.has(site.id)) {
        if (selectedTargets.size === 1) return  // en az 1 seçili kalsın
        selectedTargets.delete(site.id)
        chip.classList.remove('selected')
      } else {
        selectedTargets.add(site.id)
        chip.classList.add('selected')
      }
    }
    container.appendChild(chip)
  })
}

function setActiveSites(activeSites) {
  AI_SITES = activeSites || []
  const valid = new Set(AI_SITES.map(s => s.id))
  selectedTargets = new Set([...selectedTargets].filter(id => valid.has(id)))
  selectedPlayers = new Set([...selectedPlayers].filter(id => valid.has(id)))

  if (!selectedTargets.size && AI_SITES.length) selectedTargets = new Set(AI_SITES.map(s => s.id))
  if (!selectedPlayers.size && AI_SITES.length) selectedPlayers = new Set(AI_SITES.map(s => s.id))
}

function buildAiAdminRow() {
  const root = document.getElementById('ai-admin-row')
  root.innerHTML = ''
  ALL_SITES.forEach(site => {
    const label = document.createElement('label')
    label.innerHTML = `<input type="checkbox" value="${site.id}" ${AI_SITES.some(s => s.id === site.id) ? 'checked' : ''}> ${site.emoji} ${site.name}`
    const cb = label.querySelector('input')
    cb.onchange = async () => {
      const ids = Array.from(document.querySelectorAll('#ai-admin-row input[type="checkbox"]:checked')).map(x => x.value)
      if (!ids.length) {
        cb.checked = true
        showToast('En az 1 AI aktif kalmalı')
        return
      }
      const res = await window.aiSurvivor.setActiveSites(ids)
      setActiveSites(res.activeSites)
      syncSelectedTargetsFromPlayers()
      buildTabs()
      buildChips()
      buildVotingPanels()
      buildAiAdminRow()
    }
    root.appendChild(label)
  })
}

function persistTournamentState() {
  const payload = {
    players: [...selectedPlayers],
    eliminationVotes,
    scoreVotes,
  }
  localStorage.setItem(TOURNAMENT_KEY, JSON.stringify(payload))
}

function loadTournamentState() {
  try {
    const raw = localStorage.getItem(TOURNAMENT_KEY)
    if (!raw) return
    const data = JSON.parse(raw)
    if (Array.isArray(data.players) && data.players.length) {
      selectedPlayers = new Set(data.players.filter(id => AI_SITES.some(s => s.id === id)))
    }
    if (data.eliminationVotes && typeof data.eliminationVotes === 'object') {
      eliminationVotes = data.eliminationVotes
    }
    if (data.scoreVotes && typeof data.scoreVotes === 'object') {
      scoreVotes = data.scoreVotes
    }
  } catch (_) {}
}

function syncSelectedTargetsFromPlayers() {
  selectedTargets = new Set([...selectedTargets].filter(id => selectedPlayers.has(id)))
  if (!selectedTargets.size) selectedTargets = new Set([AI_SITES[0].id])
}

function activePlayers() {
  return AI_SITES.filter(s => selectedPlayers.has(s.id))
}

function buildPlayersRow() {
  const root = document.getElementById('players-row')
  root.innerHTML = ''
  AI_SITES.forEach(site => {
    const label = document.createElement('label')
    label.innerHTML = `<input type="checkbox" value="${site.id}" ${selectedPlayers.has(site.id) ? 'checked' : ''}> ${site.emoji} ${site.name}`
    const cb = label.querySelector('input')
    cb.onchange = () => {
      if (cb.checked) selectedPlayers.add(site.id)
      else if (selectedPlayers.size > 1) selectedPlayers.delete(site.id)
      else cb.checked = true

      syncSelectedTargetsFromPlayers()
      buildChips()
      buildVotingPanels()
      persistTournamentState()
    }
    root.appendChild(label)
  })
}

function playerOptions(excludeId, selectedValue) {
  const options = ['<option value="">— seç —</option>']
  activePlayers().forEach(p => {
    if (p.id === excludeId) return
    options.push(`<option value="${p.id}" ${selectedValue === p.id ? 'selected' : ''}>${p.emoji} ${p.name}</option>`)
  })
  return options.join('')
}

function buildEliminationRows() {
  const root = document.getElementById('elimination-votes')
  root.innerHTML = ''
  activePlayers().forEach(voter => {
    const row = document.createElement('div')
    row.className = 'vote-row'
    row.innerHTML = `
      <span class="vote-label">${voter.emoji} ${voter.name} →</span>
      <select data-voter="${voter.id}">${playerOptions(voter.id, eliminationVotes[voter.id])}</select>
    `
    row.querySelector('select').onchange = (e) => {
      eliminationVotes[voter.id] = e.target.value || ''
      renderEliminationResults()
      persistTournamentState()
    }
    root.appendChild(row)
  })
}

function renderEliminationResults() {
  const out = document.getElementById('elimination-results')
  const lines = ['Oylama Sonuçları']
  activePlayers().forEach(voter => {
    const targetId = eliminationVotes[voter.id]
    const target = AI_SITES.find(s => s.id === targetId)
    lines.push(`${voter.name} -> ${target ? target.name : '-'}`)
  })
  out.value = lines.join('\n')
}

function buildScoreRows() {
  const root = document.getElementById('score-rows')
  root.innerHTML = ''
  activePlayers().forEach(voter => {
    const current = scoreVotes[voter.id] || { targetId: '', points: '' }
    const row = document.createElement('div')
    row.className = 'score-row'
    row.innerHTML = `
      <span class="vote-label">${voter.emoji} ${voter.name} →</span>
      <select data-score-target="${voter.id}">${playerOptions(voter.id, current.targetId)}</select>
      <input data-score-points="${voter.id}" type="number" min="0" max="12" step="1" value="${current.points}">
    `
    row.querySelector('select').onchange = (e) => {
      scoreVotes[voter.id] = { ...(scoreVotes[voter.id] || {}), targetId: e.target.value || '' }
      renderScoreResults()
      persistTournamentState()
    }
    row.querySelector('input').oninput = (e) => {
      scoreVotes[voter.id] = { ...(scoreVotes[voter.id] || {}), points: e.target.value }
      renderScoreResults()
      persistTournamentState()
    }
    root.appendChild(row)
  })
}

function renderScoreResults() {
  const totals = {} // { targetId: points }
  const lines = ['Puanlama Sonuçları']

  activePlayers().forEach(voter => {
    const vote = scoreVotes[voter.id] || {}
    const target = AI_SITES.find(s => s.id === vote.targetId)
    const points = Number(vote.points)
    const safePoints = Number.isFinite(points) ? points : 0
    lines.push(`${voter.name} -> ${target ? target.name : '-'} (${safePoints} puan)`)
    if (target) totals[target.id] = (totals[target.id] || 0) + safePoints
  })

  lines.push('', 'Toplam Puanlar')
  activePlayers().forEach(player => {
    lines.push(`${player.name}: ${totals[player.id] || 0}`)
  })

  document.getElementById('score-results').value = lines.join('\n')
}

function buildVotingPanels() {
  buildPlayersRow()
  buildEliminationRows()
  buildScoreRows()
  renderEliminationResults()
  renderScoreResults()
}

function copyText(id) {
  const el = document.getElementById(id)
  el.select()
  document.execCommand('copy')
  showToast('📋 Kopyalandı')
}

function toggleMenu(forceOpen) {
  const menu = document.getElementById('side-menu')
  const toggle = document.getElementById('menu-toggle')
  const open = typeof forceOpen === 'boolean' ? forceOpen : !menu.classList.contains('open')
  menu.classList.toggle('open', open)
  if (open) menu.scrollTop = 0
  if (toggle) toggle.textContent = open ? '✕ PANELİ KAPAT' : '⚙ ADMIN / OYLAMA'
  syncPanelReserve()
}

function syncPanelReserve() {
  const menu = document.getElementById('side-menu')
  if (!menu.classList.contains('open')) {
    window.aiSurvivor.setPanelOpen(false)
    return
  }

  const rect = menu.getBoundingClientRect()
  const reservedHeight = Math.max(180, Math.ceil(window.innerHeight - rect.top - 90))
  window.aiSurvivor.setPanelOpen(reservedHeight)
}

function togglePanelFullscreen() {
  const menu = document.getElementById('side-menu')
  const btn = document.getElementById('panel-fullscreen-btn')
  if (!menu.classList.contains('open')) toggleMenu(true)
  menu.classList.toggle('fullscreen')
  btn.textContent = menu.classList.contains('fullscreen') ? '🗗 Normal Boyut' : '⛶ Tam Ekran'
  syncPanelReserve()
}

/* ── LAYOUT ── */
function setLayout(mode) {
  currentLayout = mode
  document.getElementById('btn-split').classList.toggle('active', mode === 'split')
  document.getElementById('btn-focus').classList.toggle('active', mode === 'focus')
  window.aiSurvivor.setLayout(mode, focusId)
  buildTabs()
}
function setLayoutFocus() {
  setLayout('focus')
}

/* ── STATUS UPDATES ── */
window.aiSurvivor.onStatus(({ id, status }) => {
  statusMap[id] = status
  const dot = document.getElementById('dot-' + id)
  if (dot) {
    const state = status.startsWith('error') ? 'error' : status
    dot.className = 'dot ' + state
  }
})

window.aiSurvivor.onReady((sites) => {
  if (Array.isArray(sites)) setActiveSites(sites)
  buildTabs()
  buildChips()
  buildVotingPanels()
  buildAiAdminRow()
})

/* ── BROADCAST ── */
async function sendBroadcast() {
  const text = document.getElementById('msg-input').value.trim()
  if (!text) return
  const btn = document.getElementById('send-btn')
  btn.disabled = true
  btn.textContent = 'GÖNDERİLİYOR...'
  document.getElementById('msg-input').value = ''

  const targets = [...selectedTargets]
  const results = await window.aiSurvivor.broadcast(text, targets)

  const ok    = Object.values(results).filter(r => String(r).startsWith('ok')).length
  const fail  = Object.values(results).filter(r => !String(r).startsWith('ok')).length
  const names = Object.entries(results).filter(([,v]) => !String(v).startsWith('ok')).map(([k]) => k).join(', ')

  showToast(fail === 0
    ? `✅ ${ok} AI'a gönderildi`
    : `⚠️ ${ok} başarılı, ${fail} hata (${names})`)

  btn.disabled = false
  btn.textContent = 'GÖNDER ⚡'
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault()
    sendBroadcast()
  }
}

/* ── TOAST ── */
function showToast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 2800)
}

/* ── INIT ── */
async function init() {
  window.aiSurvivor.setPanelOpen(false)
  const siteMeta = await window.aiSurvivor.getAvailableSites()
  ALL_SITES = siteMeta.allSites || []
  CORE_SITE_IDS = siteMeta.coreSiteIds || []
  setActiveSites((siteMeta.activeSiteIds || []).map(id => ALL_SITES.find(s => s.id === id)).filter(Boolean))

  loadTournamentState()
  syncSelectedTargetsFromPlayers()
  buildTabs()
  buildChips()
  buildVotingPanels()
  buildAiAdminRow()
}

document.getElementById('menu-toggle').addEventListener('click', () => toggleMenu())
document.getElementById('panel-fullscreen-btn').addEventListener('click', () => togglePanelFullscreen())
document.getElementById('panel-top-btn').addEventListener('click', () => {
  document.getElementById('side-menu').scrollTop = 0
})
document.addEventListener('click', (e) => {
  const menu = document.getElementById('side-menu')
  if (!menu.classList.contains('open')) return
  if (menu.contains(e.target) || e.target.id === 'menu-toggle') return
  toggleMenu(false)
})
window.addEventListener('resize', () => syncPanelReserve())
init()
</script>
</body>
</html>
