<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Şarkı Sözleri Zamanlama Editörü</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c111b;
      --panel: #171f2d;
      --panel-soft: #202a3b;
      --text: #e6edf9;
      --muted: #9aa9c0;
      --accent: #4ea1ff;
      --accent-soft: #2a6ab3;
      --line: #2f3d55;
      --active: #25364f;
      --ok: #4bc47a;
    }

    * {
      box-sizing: border-box;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1rem;
    }

    .app {
      max-width: 1600px;
      margin: 0 auto;
      display: grid;
      gap: 1rem;
      grid-template-columns: 320px 1fr 340px;
      align-items: start;
    }

    .stack {
      display: grid;
      gap: 1rem;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem;
    }

    h1, h2, h3 {
      margin: 0 0 0.75rem 0;
      font-weight: 600;
    }

    h1 { font-size: 1.35rem; }
    h2 { font-size: 1.05rem; }
    h3 { font-size: 0.95rem; color: var(--muted); }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
    }

    textarea,
    input[type="text"],
    input[type="number"] {
      width: 100%;
      color: var(--text);
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.55rem 0.65rem;
    }

    textarea {
      min-height: 300px;
      resize: vertical;
    }

    button,
    .button-like {
      border: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--text);
      padding: 0.42rem 0.64rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 0.88rem;
    }

    button:hover,
    .button-like:hover {
      border-color: var(--accent);
      background: #273246;
    }

    button.primary {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    button.tiny {
      padding: 0.32rem 0.45rem;
      font-size: 0.78rem;
    }

    input[type="file"] { display: none; }

    .time-display {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      min-width: 130px;
    }

    #seekBar {
      width: 100%;
      accent-color: var(--accent);
    }

    .preview {
      border: 1px dashed var(--line);
      border-radius: 10px;
      background: #131b2a;
      padding: 0.75rem;
      min-height: 66px;
      display: grid;
      align-content: center;
      gap: 0.2rem;
      margin-left: auto;
      flex: 1;
      min-width: 260px;
    }

    .preview .label {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .preview .text {
      font-size: 1rem;
      font-weight: 600;
      color: #cfe3ff;
      min-height: 1.2em;
    }

    .lyrics-list,
    .done-list {
      display: grid;
      gap: 0.45rem;
      margin-top: 0.65rem;
    }

    .lyric-row,
    .done-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.5rem;
      background: #151d2b;
    }

    .lyric-row.active,
    .done-item.active {
      border-color: var(--accent);
      background: var(--active);
    }

    .lyric-controls {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) 150px 150px auto auto;
      gap: 0.45rem;
      align-items: center;
    }

    .time-field {
      display: grid;
      grid-template-rows: auto auto;
      gap: 0.2rem;
      align-items: center;
    }

    .time-adjust {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.2rem;
    }

    .small {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .done-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .done-time {
      color: var(--ok);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
    }

    .done-edit {
      margin-top: 0.5rem;
      display: none;
      gap: 0.35rem;
    }

    .done-edit.open {
      display: grid;
    }

    #exportOutput {
      min-height: 160px;
      white-space: pre;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    @media (max-width: 1200px) {
      .app { grid-template-columns: 1fr; }
      textarea { min-height: 180px; }
    }

    @media (max-width: 860px) {
      .lyric-controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="stack">
      <section class="card">
        <h2>Şarkı Sözü Girişi</h2>
        <textarea id="lyricsInput" placeholder="Şarkı sözlerini buraya yapıştırın, her satıra bir söz..."></textarea>
        <div class="row" style="margin-top: 0.6rem;">
          <button id="loadLyricsBtn" class="primary">Sözleri Yükle</button>
        </div>
      </section>

      <section class="card">
        <h2>Dışa Aktar</h2>
        <div class="row" style="margin-bottom: 0.5rem;">
          <button id="exportBtn" class="primary">Zamanlamayı Dışa Aktar</button>
        </div>
        <textarea id="exportOutput" readonly placeholder="start|end|lyric"></textarea>
      </section>
    </aside>

    <section class="stack">
      <section class="card">
        <h1>Manuel Şarkı Sözü Zamanlama Editörü</h1>

        <div class="row" style="margin-bottom: 0.65rem;">
          <label class="button-like" for="audioInput">Ses Dosyası Yükle (mp3/wav)</label>
          <input id="audioInput" type="file" accept="audio/mpeg,audio/wav,audio/mp3,.mp3,.wav" />
          <span id="audioName" class="small">Dosya seçilmedi</span>

          <div class="preview">
            <div class="label">Sıradaki satır önizleme</div>
            <div id="nextLyricPreview" class="text">—</div>
          </div>
        </div>

        <div class="row" style="gap: 0.4rem; margin-bottom: 0.5rem;">
          <button id="playPauseBtn" class="primary">Oynat</button>
          <button data-jump="-15">-15s</button>
          <button data-jump="-5">-5s</button>
          <button data-jump="5">+5s</button>
          <button data-jump="15">+15s</button>
          <span id="timeDisplay" class="time-display">0.000 / 0.000</span>
        </div>

        <input id="seekBar" type="range" min="0" max="0" step="0.001" value="0" />
        <audio id="audio" preload="metadata"></audio>
      </section>

      <section class="card">
        <h2>Düzenlenebilir Şarkı Sözü Satırları</h2>
        <div id="lyricsList" class="lyrics-list"></div>
      </section>
    </section>

    <aside class="stack">
      <section class="card">
        <h2>Tamamlanan Satırlar</h2>
        <h3>Başlangıç ve bitişi belirlenen satırlar burada akış olarak görünür.</h3>
        <div id="doneList" class="done-list"></div>
      </section>
    </aside>
  </main>

  <script>
    const audio = document.getElementById('audio');
    const audioInput = document.getElementById('audioInput');
    const audioName = document.getElementById('audioName');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const timeDisplay = document.getElementById('timeDisplay');
    const seekBar = document.getElementById('seekBar');
    const nextLyricPreview = document.getElementById('nextLyricPreview');

    const lyricsInput = document.getElementById('lyricsInput');
    const loadLyricsBtn = document.getElementById('loadLyricsBtn');
    const lyricsList = document.getElementById('lyricsList');
    const doneList = document.getElementById('doneList');

    const exportBtn = document.getElementById('exportBtn');
    const exportOutput = document.getElementById('exportOutput');

    const jumpButtons = Array.from(document.querySelectorAll('[data-jump]'));

    const lyrics = [];
    let activeObjectUrl = null;

    const toFixed3 = (value) => Number(value).toFixed(3);
    const parseTimeValue = (value) => {
      const num = Number(value);
      return Number.isFinite(num) ? num : null;
    };

    const isDone = (line) => line.start !== null && line.end !== null;

    function normalizeTimes(line) {
      if (line.start !== null) line.start = Math.max(0, line.start);
      if (line.end !== null) line.end = Math.max(0, line.end);
      if (line.start !== null && line.end !== null && line.end < line.start) {
        const temp = line.end;
        line.end = line.start;
        line.start = temp;
      }
    }

    function getPendingLyrics() {
      return lyrics.filter((line) => !isDone(line));
    }

    function getDoneLyrics() {
      return lyrics.filter((line) => isDone(line));
    }

    function updateNextLyricPreview() {
      const next = getPendingLyrics()[0];
      nextLyricPreview.textContent = next ? next.text : 'Tüm satırlar zamanlandı';
    }

    function updateTimeDisplay() {
      const current = Number.isFinite(audio.currentTime) ? audio.currentTime : 0;
      const duration = Number.isFinite(audio.duration) ? audio.duration : 0;
      timeDisplay.textContent = `${toFixed3(current)} / ${toFixed3(duration)}`;
      seekBar.max = String(duration);
      seekBar.value = String(current);
      highlightActiveLyric(current);
    }

    function clampTime(time) {
      const max = Number.isFinite(audio.duration) ? audio.duration : Infinity;
      return Math.min(Math.max(time, 0), max);
    }

    function renderLyrics() {
      lyricsList.innerHTML = '';

      getPendingLyrics().forEach((line) => {
        const row = document.createElement('div');
        row.className = 'lyric-row';
        row.dataset.id = String(line.id);

        const controls = document.createElement('div');
        controls.className = 'lyric-controls';

        const textInput = document.createElement('input');
        textInput.type = 'text';
        textInput.value = line.text;
        textInput.placeholder = 'Şarkı sözü';
        textInput.addEventListener('input', () => {
          line.text = textInput.value;
          renderDone();
          updateNextLyricPreview();
        });

        const startWrap = document.createElement('div');
        startWrap.className = 'time-field';

        const startInput = document.createElement('input');
        startInput.type = 'number';
        startInput.step = '0.001';
        startInput.min = '0';
        startInput.placeholder = 'Başlangıç';
        startInput.value = line.start !== null ? toFixed3(line.start) : '';
        startInput.addEventListener('change', () => {
          line.start = parseTimeValue(startInput.value);
          normalizeTimes(line);
          rerenderAll();
        });

        const startAdjust = document.createElement('div');
        startAdjust.className = 'time-adjust';

        const startMinus = document.createElement('button');
        startMinus.className = 'tiny';
        startMinus.textContent = '-0.1s';
        startMinus.addEventListener('click', () => {
          line.start = line.start === null ? Math.max(0, audio.currentTime - 0.1) : Math.max(0, line.start - 0.1);
          normalizeTimes(line);
          rerenderAll();
        });

        const startPlus = document.createElement('button');
        startPlus.className = 'tiny';
        startPlus.textContent = '+0.1s';
        startPlus.addEventListener('click', () => {
          line.start = line.start === null ? audio.currentTime + 0.1 : line.start + 0.1;
          normalizeTimes(line);
          rerenderAll();
        });

        startAdjust.append(startMinus, startPlus);
        startWrap.append(startInput, startAdjust);

        const endWrap = document.createElement('div');
        endWrap.className = 'time-field';

        const endInput = document.createElement('input');
        endInput.type = 'number';
        endInput.step = '0.001';
        endInput.min = '0';
        endInput.placeholder = 'Bitiş';
        endInput.value = line.end !== null ? toFixed3(line.end) : '';
        endInput.addEventListener('change', () => {
          line.end = parseTimeValue(endInput.value);
          normalizeTimes(line);
          rerenderAll();
        });

        const endAdjust = document.createElement('div');
        endAdjust.className = 'time-adjust';

        const endMinus = document.createElement('button');
        endMinus.className = 'tiny';
        endMinus.textContent = '-0.1s';
        endMinus.addEventListener('click', () => {
          line.end = line.end === null ? Math.max(0, audio.currentTime - 0.1) : Math.max(0, line.end - 0.1);
          normalizeTimes(line);
          rerenderAll();
        });

        const endPlus = document.createElement('button');
        endPlus.className = 'tiny';
        endPlus.textContent = '+0.1s';
        endPlus.addEventListener('click', () => {
          line.end = line.end === null ? audio.currentTime + 0.1 : line.end + 0.1;
          normalizeTimes(line);
          rerenderAll();
        });

        endAdjust.append(endMinus, endPlus);
        endWrap.append(endInput, endAdjust);

        const setStartBtn = document.createElement('button');
        setStartBtn.textContent = 'Başlangıcı Ayarla';
        setStartBtn.addEventListener('click', () => {
          line.start = audio.currentTime;
          normalizeTimes(line);
          rerenderAll();
        });

        const setEndBtn = document.createElement('button');
        setEndBtn.textContent = 'Bitişi Ayarla';
        setEndBtn.addEventListener('click', () => {
          line.end = audio.currentTime;
          normalizeTimes(line);
          rerenderAll();
        });

        controls.append(textInput, startWrap, endWrap, setStartBtn, setEndBtn);
        row.append(controls);
        lyricsList.append(row);
      });

      if (lyricsList.childElementCount === 0) {
        const empty = document.createElement('div');
        empty.className = 'small';
        empty.textContent = 'Düzenlenecek satır kalmadı.';
        lyricsList.append(empty);
      }
    }

    function renderDone() {
      doneList.innerHTML = '';

      getDoneLyrics().forEach((line) => {
        const card = document.createElement('div');
        card.className = 'done-item';
        card.dataset.id = String(line.id);

        const top = document.createElement('div');
        top.className = 'done-top';

        const text = document.createElement('strong');
        text.textContent = line.text;

        const timing = document.createElement('span');
        timing.className = 'done-time';
        timing.textContent = `${toFixed3(line.start)} → ${toFixed3(line.end)}`;

        const editBtn = document.createElement('button');
        editBtn.textContent = 'Düzenle';
        editBtn.className = 'tiny';

        const editArea = document.createElement('div');
        editArea.className = 'done-edit';

        const textInput = document.createElement('input');
        textInput.type = 'text';
        textInput.value = line.text;

        const startInput = document.createElement('input');
        startInput.type = 'number';
        startInput.step = '0.001';
        startInput.value = toFixed3(line.start);

        const endInput = document.createElement('input');
        endInput.type = 'number';
        endInput.step = '0.001';
        endInput.value = toFixed3(line.end);

        const saveBtn = document.createElement('button');
        saveBtn.textContent = 'Kaydet';
        saveBtn.className = 'primary tiny';
        saveBtn.addEventListener('click', () => {
          line.text = textInput.value;
          line.start = parseTimeValue(startInput.value);
          line.end = parseTimeValue(endInput.value);
          normalizeTimes(line);
          rerenderAll();
        });

        const reopenBtn = document.createElement('button');
        reopenBtn.textContent = 'Düzenlemeye Geri Al';
        reopenBtn.className = 'tiny';
        reopenBtn.addEventListener('click', () => {
          line.end = null;
          rerenderAll();
        });

        editBtn.addEventListener('click', () => {
          editArea.classList.toggle('open');
        });

        editArea.append(textInput, startInput, endInput, saveBtn, reopenBtn);

        top.append(text, timing, editBtn);
        card.append(top, editArea);
        doneList.append(card);
      });

      if (doneList.childElementCount === 0) {
        const empty = document.createElement('div');
        empty.className = 'small';
        empty.textContent = 'Henüz tamamlanan satır yok.';
        doneList.append(empty);
      }
    }

    function highlightActiveLyric(currentTime) {
      const pendingRows = Array.from(lyricsList.querySelectorAll('.lyric-row'));
      pendingRows.forEach((row) => {
        const id = Number(row.dataset.id);
        const line = lyrics.find((item) => item.id === id);
        const active = line && isDone(line) && currentTime >= line.start && currentTime <= line.end;
        row.classList.toggle('active', Boolean(active));
      });

      const doneRows = Array.from(doneList.querySelectorAll('.done-item'));
      doneRows.forEach((row) => {
        const id = Number(row.dataset.id);
        const line = lyrics.find((item) => item.id === id);
        const active = line && isDone(line) && currentTime >= line.start && currentTime <= line.end;
        row.classList.toggle('active', Boolean(active));
      });
    }

    function rerenderAll() {
      renderLyrics();
      renderDone();
      updateNextLyricPreview();
      highlightActiveLyric(audio.currentTime);
    }

    audioInput.addEventListener('change', () => {
      const [file] = audioInput.files || [];
      if (!file) return;

      if (activeObjectUrl) URL.revokeObjectURL(activeObjectUrl);

      const objectUrl = URL.createObjectURL(file);
      activeObjectUrl = objectUrl;
      audio.src = objectUrl;
      audioName.textContent = file.name;
      audio.load();
      playPauseBtn.textContent = 'Oynat';
    });

    playPauseBtn.addEventListener('click', () => {
      if (!audio.src) return;
      if (audio.paused) audio.play();
      else audio.pause();
    });

    audio.addEventListener('play', () => { playPauseBtn.textContent = 'Duraklat'; });
    audio.addEventListener('pause', () => { playPauseBtn.textContent = 'Oynat'; });

    audio.addEventListener('timeupdate', updateTimeDisplay);
    audio.addEventListener('loadedmetadata', updateTimeDisplay);
    audio.addEventListener('durationchange', updateTimeDisplay);

    seekBar.addEventListener('input', () => {
      const value = parseFloat(seekBar.value);
      audio.currentTime = clampTime(value);
      updateTimeDisplay();
    });

    jumpButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const offset = Number(button.dataset.jump);
        audio.currentTime = clampTime(audio.currentTime + offset);
        updateTimeDisplay();
      });
    });

    loadLyricsBtn.addEventListener('click', () => {
      const lines = lyricsInput.value
        .split('\n')
        .map((line) => line.trim())
        .filter((line) => line.length > 0);

      lyrics.length = 0;
      lines.forEach((line, index) => {
        lyrics.push({ id: index + 1, text: line, start: null, end: null });
      });

      rerenderAll();
    });

    exportBtn.addEventListener('click', () => {
      const output = lyrics
        .filter((line) => line.text.trim().length > 0)
        .map((line) => {
          const start = line.start !== null ? toFixed3(line.start) : '0.000';
          const end = line.end !== null ? toFixed3(line.end) : '0.000';
          return `${start}|${end}|${line.text}`;
        })
        .join('\n');

      exportOutput.value = output;
    });

    rerenderAll();
    updateTimeDisplay();
  </script>
</body>
</html>
